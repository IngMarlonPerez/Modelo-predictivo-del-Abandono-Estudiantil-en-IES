name: CI

on:
  push:
    branches: [main, pruebas, devmarlon, contribuciones]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Controlador ODBC del sistema (lo requiere pyodbc)
        run: sudo apt-get update -q && sudo apt-get install -yq unixodbc
      - run: pip install -r requirements.txt
      - name: Pruebas (las de integración se omiten sin SQL Server)
        run: |
          python -m pytest -q -W ignore 2>&1 | tee salida.txt
          echo "### Backend: $(tail -n 1 salida.txt)" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend · vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    name: Compose · validación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: DB_PASSWORD=x docker compose config -q
      - run: node --check scripts/dev.mjs

  origen:
    name: Origen del PR
    runs-on: ubuntu-latest
    steps:
      - name: Respetar el flujo devmarlon/contribuciones → pruebas → main
        env:
          EVENTO: ${{ github.event_name }}
          DESTINO: ${{ github.base_ref }}
          ORIGEN: ${{ github.head_ref }}
          MISMO_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$EVENTO" != "pull_request" ]; then echo "No es un pull request."; exit 0; fi
          if [ "$DESTINO" = "main" ] && { [ "$ORIGEN" != "pruebas" ] || [ "$MISMO_REPO" != "true" ]; }; then
            echo "::error::A main solo se llega desde la rama pruebas de este repositorio."; exit 1
          fi
          if [ "$DESTINO" = "pruebas" ] && { [ "$MISMO_REPO" != "true" ] || { [ "$ORIGEN" != "devmarlon" ] && [ "$ORIGEN" != "contribuciones" ]; }; }; then
            echo "::error::A pruebas solo se llega desde devmarlon o contribuciones."; exit 1
          fi
          echo "Origen permitido: $ORIGEN → $DESTINO"
