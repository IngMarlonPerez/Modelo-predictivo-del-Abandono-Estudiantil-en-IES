<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="t">
<title id="t">VicMar · isotipo</title>
<style>
  .iso-pulso { transform-box: fill-box; transform-origin: center; animation: iso-pulso 2.4s ease-out infinite; }
  @keyframes iso-pulso { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
  .iso-destello { animation: iso-destello 5s ease-in-out infinite; }
  @keyframes iso-destello { 0%, 62% { transform: translateX(-40px); } 82%, 100% { transform: translateX(44px); } }
  @media (prefers-reduced-motion: reduce) { .iso-pulso, .iso-destello { animation: none; opacity: 0; } }
</style>
